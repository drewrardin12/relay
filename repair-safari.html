<body><div><p>Repairing Relay…</p><small>Your ministry records are not being deleted.</small></div>
<script>
(async()=>{
  try {
    if ('serviceWorker' in navigator) {
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if ('caches' in window) {
      const names=await caches.keys();
      await Promise.all(names.filter(name=>name.startsWith('relay-shell-')).map(name=>caches.delete(name)));
    }
  } finally {
    location.replace('./launch.html?v=20260929-safari-recovery3#helm');
  }
})();
</script></body></html>
